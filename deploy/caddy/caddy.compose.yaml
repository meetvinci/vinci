# The edge of a team install that logs people in with Vinci accounts (VINCI_AUTH=laravel) instead of Cloudflare Access:
# the counterpart of deploy/cloudflare/cloudflared.compose.yaml, loaded in its place through COMPOSE_FILE in .env.
# Caddy publishes 80 and 443 with an automatic certificate for VINCI_PUBLIC_HOST, sends /cdn-cgi/access/* to the
# Laravel API (the login pages) and everything else to the hub. A login is a Sanctum token in the vinci_session cookie;
# the hub checks it with the API (GET /internal/session, on the accounts network) for every request and every open
# socket, so a logout or a password change ends it at once. Caddy vouches for nobody: it only sends a visit without the
# cookie to the login page. The Caddyfile is inline below (CADDYFILE), so this is the only file the mode adds.
x-logging: &logging
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # Compose cannot place a config file in a read-only container, so the Caddyfile comes in CADDYFILE and is written
    # to the /tmp tmpfs at start.
    entrypoint: [sh, -c, 'printf "%s" "$$CADDYFILE" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile']
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1m
      - /config:rw,nosuid,nodev,noexec,size=1m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8099/]
      interval: 30s
      timeout: 5s
      start_period: 15s
    environment:
      CADDYFILE: |
        {
          admin off
        }

        # The health check only, inside the container.
        http://127.0.0.1:8099 {
          bind 127.0.0.1
          respond "ok"
        }

        ${VINCI_PUBLIC_HOST} {
          # The hub trusts no header for identity; a visitor's own Access headers still never reach it.
          request_header -Cf-Access-*

          # Browsers keep to HTTPS for a year. Not for subdomains, which may be other people's sites, and not preloaded.
          header Strict-Transport-Security "max-age=31536000"

          # The hub's account routes on the API are never public.
          @internal path /internal /internal/*
          handle @internal {
            respond 404
          }

          handle /cdn-cgi/access/* {
            reverse_proxy api:8080
          }

          # No login cookie: the API answers with a redirect to the login page that returns here after login. The hub's
          # icons stay public, as with Cloudflare Access.
          @anonymous {
            not header_regexp Cookie (^|;\s*)vinci_session=
            not path /favicon.ico /img/favicon/*
          }
          handle @anonymous {
            rewrite * /cdn-cgi/access/required
            reverse_proxy api:8080 {
              header_up X-Vinci-Original-Uri {http.request.orig_uri}
            }
          }

          # A login cookie the hub refuses (logged out, ended by a password change or reset, or past its 7 days): a page
          # load goes back to the login page like a visit without the cookie, not to an empty 401. Other requests (the
          # app's RPC, files) keep the 401.
          @page header Sec-Fetch-Mode navigate
          handle @page {
            reverse_proxy hub:47192 {
              @refused status 401
              handle_response @refused {
                rewrite * /cdn-cgi/access/required
                reverse_proxy api:8080 {
                  header_up X-Vinci-Original-Uri {http.request.orig_uri}
                }
              }
            }
          }

          handle {
            reverse_proxy hub:47192
          }
        }
    volumes:
      # Certificates and the ACME account: kept, so a restart does not ask Let's Encrypt again.
      - caddy-data:/data
    networks:
      # The hub, and the internet for certificates.
      tunnel: {}
      # The API's login pages.
      login: {}

  hub:
    environment:
      # The hub checks each login and a person's own password change through the API's /internal/session routes, and the
      # admin panel adds, resets and removes accounts through /internal/users.
      HUB_ACCOUNTS_URL: http://api:8080
      HUB_ACCOUNTS_TOKEN: ${API_INTERNAL_TOKEN:?set API_INTERNAL_TOKEN in .env}
    networks:
      accounts: {}

  api:
    environment:
      APP_KEY: ${API_APP_KEY:?set API_APP_KEY in .env}
      APP_URL: https://${VINCI_PUBLIC_HOST:?set VINCI_PUBLIC_HOST in .env}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?set API_INTERNAL_TOKEN in .env}
    networks:
      login: {}
      accounts: {}

networks:
  # The edge and the hub. Not internal: Caddy gets its certificates from Let's Encrypt.
  tunnel: {}
  # Caddy and the API only. No internet.
  login:
    internal: true
  # The hub and the API only: the hub checks logins and manages accounts. No internet, no PostgreSQL.
  accounts:
    internal: true

volumes:
  caddy-data: {}
