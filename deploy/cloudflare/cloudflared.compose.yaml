# Optional: the Cloudflare Tunnel, for a server without a public address or open ports. Add it to COMPOSE_FILE in .env
# after caddy.compose.yaml. `bun scripts/deploy.ts cloudflare apply` creates the tunnel and its one route in Cloudflare
# (a remotely managed tunnel), so this container needs only TUNNEL_TOKEN from /opt/vinci/.env and no config file. The
# route sends the team hostname to http://caddy:80: Cloudflare carries HTTPS, Caddy serves plain HTTP to cloudflared
# only and publishes no port, and the Laravel API is the login as without the tunnel.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: [tunnel, --no-autoupdate, --metrics, 127.0.0.1:20241, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in /opt/vinci/.env with bun scripts/deploy.ts cloudflare apply --env-out}
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    # At most 30 MB of Docker's log.
    logging:
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, 127.0.0.1:20241, ready]
      interval: 30s
      timeout: 5s
      start_period: 15s
    networks: [tunnel]

  # Behind the tunnel Caddy needs no certificate and no open port: plain HTTP on the tunnel network, for cloudflared.
  caddy:
    ports: !reset []
    environment:
      VINCI_SITE: http://${VINCI_PUBLIC_HOST:?set VINCI_PUBLIC_HOST in .env}
