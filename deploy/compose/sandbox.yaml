# The sandbox every person gets: where their bots' tools run. Each sandbox-<id> service in users.compose.yaml extends
# this one and mounts only that person's bot folders, shared skills (read only) and the folder their daemon shares with
# it (read only). Not a Compose file of its own: never list it in COMPOSE_FILE.
services:
  sandbox:
    image: meetvinci-sandbox:${MEETVINCI_TAG:?set MEETVINCI_TAG in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SANDBOX_MEMORY:-512m}
    memswap_limit: ${SANDBOX_MEMORY:-512m}
    cpus: ${SANDBOX_CPUS:-1}
    pids_limit: ${SANDBOX_PIDS:-256}
    restart: unless-stopped
