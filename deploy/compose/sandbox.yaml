# The sandbox every person gets: where their bots' tools run. Each sandbox-<id> service in users.compose.yaml extends
# this one and mounts only that person's bot folders (from their sandbox disk, which caps what bots write), shared
# skills (read only) and the folder their daemon shares with it (read only). Not a Compose file of its own: never list it in COMPOSE_FILE.
services:
  sandbox:
    image: ${VINCI_REGISTRY:-}vinci-sandbox:${VINCI_TAG:?set VINCI_TAG in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SANDBOX_MEMORY:-512m}
    memswap_limit: ${SANDBOX_MEMORY:-512m}
    cpus: ${SANDBOX_CPUS:-1}
    pids_limit: ${SANDBOX_PIDS:-256}
    restart: unless-stopped
    # At most 30 MB of Docker's log per container: what a bot prints there cannot fill the server.
    logging:
      options:
        max-size: 10m
        max-file: '3'
