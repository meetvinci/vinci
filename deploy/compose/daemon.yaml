# The daemon every person gets: each daemon-<id> service in users.compose.yaml extends this one.
# Not a Compose file of its own: never list it in COMPOSE_FILE.
services:
  daemon:
    image: vinci-daemon:${VINCI_TAG:?set VINCI_TAG in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${DAEMON_MEMORY:-512m}
    memswap_limit: ${DAEMON_MEMORY:-512m}
    cpus: ${DAEMON_CPUS:-1}
    pids_limit: ${DAEMON_PIDS:-256}
    restart: unless-stopped
    # At most 30 MB of Docker's log per container, so a chatty bot cannot fill the server through it.
    logging:
      options:
        max-size: 10m
        max-file: '3'
    # The image's health check, probed every second while starting, so `apply` does not wait 30 s per daemon.
    healthcheck:
      start_period: 30s
      start_interval: 1s
    environment:
      DAEMON_PUBLIC_URLS: https://${VINCI_PUBLIC_HOST:?set VINCI_PUBLIC_HOST in .env}
      WEB_PUBLIC_URL: https://${VINCI_PUBLIC_HOST}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Ignored from one-mode piece H on (every daemon refuses), kept for one release so that an image from before it,
      # under these files during an upgrade or a rollback, still refuses. Remove after the next release (gotcha 314).
      DAEMON_TEAM: 'true'
      # The firewall's exceptions: the secrets proxy lets bots through to exactly these <IPv4>:<port> too.
      VINCI_INTERNAL_ALLOW: ${VINCI_INTERNAL_ALLOW:-}
      # Model API keys from .env, the same for every person. Bots do not see them: the sandbox has none.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
