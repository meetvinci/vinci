# Vinci for a team: the hub, web app and API. Lives in /opt/vinci next to .env, users.yaml, daemon.yaml,
# sandbox.yaml and caddy.compose.yaml (deploy/caddy). `bun deploy.ts apply` writes users.compose.yaml (per
# person a daemon and a sandbox, each with its network and volume, extending daemon.yaml and sandbox.yaml) and
# hub/users.json from users.yaml. .env sets COMPOSE_FILE to load this file, caddy.compose.yaml and users.compose.yaml
# together, and cloudflared.compose.yaml (deploy/cloudflare) too for the optional Cloudflare Tunnel.
# The provisioner runs the same apply for the hub's admin panel.
# Nothing here is published on a host interface: the edge (Caddy on 80 and 443, or behind cloudflared) is the only way in.
name: vinci

# At most 30 MB of Docker's log per container.
x-logging: &logging
  options:
    max-size: 10m
    max-file: '3'

services:
  # One-off root jobs for `bun deploy.ts`: owner-socket folders, backups, restores and purges. No network.
  tools:
    profiles: [setup]
    image: ${VINCI_REGISTRY:-}vinci-daemon:${VINCI_TAG}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ipc:/ipc

  # One-off root jobs for `bun deploy.ts` that create, mount, grow and delete each person's sandbox disk (disks/<id>.img,
  # mounted at disks/<id>) on the host. Docker's volume driver cannot mount a disk image, and the mount must be in the
  # host's mount namespace, so this enters it (nsenter, PID 1) and runs the host's own mount, losetup, mkfs.ext4 and
  # resize2fs: privileged, no network, nothing but deploy.ts's fixed scripts. The provisioner holds the Docker socket,
  # so this gives it nothing it lacked.
  disks:
    profiles: [setup]
    image: ${VINCI_REGISTRY:-}vinci-daemon:${VINCI_TAG}
    user: "0:0"
    entrypoint: ["nsenter", "--target", "1", "--mount", "--", "sh", "-c"]
    privileged: true
    pid: host
    network_mode: none

  # The only origin besides the API's login pages that Caddy reaches. Sees each person's data/ipc folder (one volume, a subfolder per person) and
  # nothing else of their data. Its user list, admin list and pins live in ./hub.
  hub:
    image: ${VINCI_REGISTRY:-}vinci-hub:${VINCI_TAG}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # Probed every second while starting, so the nightly backup's hub stop ends as soon as the hub answers.
    healthcheck:
      start_period: 30s
      start_interval: 1s
    environment:
      HUB_PUBLIC_URL: https://${VINCI_PUBLIC_HOST}
      HUB_WEB_URL: http://web:47190
      HUB_ADMIN_EMAILS: ${HUB_ADMIN_EMAILS:?set HUB_ADMIN_EMAILS in .env}
      # The global sync at start runs once per version, not at every restart.
      HUB_VERSION: ${VINCI_TAG}
      PROVISIONER_URL: http://provisioner:47193
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?set PROVISIONER_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./hub:/data
      - ipc:/ipc
    networks:
      edge: {}
      web: {}
      provisioner: {}

  # Adds, disables and removes people for the hub's admin panel by running `bun deploy.ts apply` in /opt/vinci. It
  # holds the Docker socket, which is root on the
  # host: it answers only the hub's token on the provisioner network, a fixed set of requests, one change at a time.
  # Root without capabilities: it reads and writes root's files in /opt/vinci and the socket as their owner.
  # /opt/vinci is mounted at the same path, so Compose resolves ./hub and the other relative paths as on the host.
  provisioner:
    image: ${VINCI_REGISTRY:-}vinci-provisioner:${VINCI_TAG}
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    environment:
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?set PROVISIONER_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # rslave: a sandbox disk unmounted on the host is unmounted here too. A plain bind keeps a copy of every disk
      # mounted when it started, which holds the image's loop device after umount, purge or a disk replacement.
      - type: bind
        source: .
        target: /opt/vinci
        bind:
          propagation: rslave
    networks:
      provisioner: {}

  # Keeps bots off the server's internal addresses: every daemon and sandbox reaches the internet and DNS, the hub
  # reaches each daemon's port, and nothing else (the hub, web, provisioner, other daemons, cloudflared, the host and
  # its sshd, cloud metadata, private ranges). Named iptables chains for the daemon and sandbox bridges (mv-d*), in
  # DOCKER-USER and INPUT;
  # no policy and no other rule changes. The rules outlive this container; until it first writes them (at boot, about
  # 0.2 s), daemons are unfiltered, and the hub cannot reach them because their networks drop traffic between
  # containers. `bun deploy.ts firewall remove` deletes the rules.
  firewall:
    image: ${VINCI_REGISTRY:-}vinci-firewall:${VINCI_TAG}
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    restart: unless-stopped
    logging: *logging
    environment:
      # Off by default: comma-separated <IPv4>:<port> (TCP) that every daemon may still reach.
      VINCI_INTERNAL_ALLOW: ${VINCI_INTERNAL_ALLOW:-}

  # One shared web app in hub mode: its server calls only the hub, never a daemon.
  web:
    image: ${VINCI_REGISTRY:-}vinci-web:${VINCI_TAG}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    environment:
      WEB_HUB_URL: http://hub:47192
      WEB_PUBLIC_URL: https://${VINCI_PUBLIC_HOST}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      web: {}

  api:
    image: ${VINCI_REGISTRY:-}vinci-api:${VINCI_TAG}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: vinci
      DB_USERNAME: vinci
      DB_PASSWORD: ${VINCI_DB_PASSWORD:?set VINCI_DB_PASSWORD in .env}
    networks:
      api: {}

  # The entrypoint starts as root to own the data and socket folders, then runs PostgreSQL as its own user: only the
  # capabilities for that. Compose cannot place a config file in a read-only container, so the first-start SQL comes in
  # VINCI_INIT_SQL and is written to a tmpfs, as Caddy's Caddyfile is.
  postgres:
    image: postgres:18-alpine
    entrypoint: [sh, -c, 'printf "%s" "$$VINCI_INIT_SQL" > /docker-entrypoint-initdb.d/10-vinci.sql && exec docker-entrypoint.sh postgres']
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=1m
      - /docker-entrypoint-initdb.d:rw,nosuid,nodev,noexec,size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${VINCI_POSTGRES_PASSWORD:?set VINCI_POSTGRES_PASSWORD in .env}
      VINCI_DB_PASSWORD: ${VINCI_DB_PASSWORD}
      VINCI_INIT_SQL: |
        \getenv vinci_password VINCI_DB_PASSWORD
        CREATE ROLE vinci LOGIN PASSWORD :'vinci_password';
        CREATE DATABASE vinci OWNER vinci;
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$VINCI_DB_PASSWORD\" psql -h 127.0.0.1 -U vinci -d vinci -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      api: {}

networks:
  api:
    internal: true
  # Caddy and the hub only. No internet.
  edge:
    internal: true
  # The hub and the web app only. No internet.
  web:
    internal: true
  # The hub and the provisioner only. No internet.
  provisioner:
    internal: true

volumes:
  # Each person's data/ipc folder, as ipc/<id>. Daemons mount only their own subfolder.
  ipc: {}
  postgres-data: {}
