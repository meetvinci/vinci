# MeetVinci for a team: the hub and the web app. Lives in /opt/meetvinci next to .env, users.yaml, daemon.yaml and
# cloudflared.compose.yaml (deploy/cloudflare). `bun deploy.ts apply` writes users.compose.yaml (one daemon, network
# and volume per person, each extending daemon.yaml) and hub/users.json from users.yaml. .env sets COMPOSE_FILE to
# load this file, cloudflared.compose.yaml and users.compose.yaml together.
# The provisioner runs the same apply for the hub's admin panel.
# Nothing is published on a host interface: cloudflared is the only way in.
name: meetvinci

services:
  # One-off root jobs for `bun deploy.ts`: owner-socket folders, backups, restores and purges. No network.
  tools:
    profiles: [setup]
    image: meetvinci-daemon:${MEETVINCI_TAG}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ipc:/ipc

  # The only origin cloudflared reaches. Sees each person's data/ipc folder (one volume, a subfolder per person) and
  # nothing else of their data. Its user list, admin list and pins live in ./hub.
  hub:
    image: meetvinci-hub:${MEETVINCI_TAG}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    # Probed every second while starting, so the nightly backup's hub stop ends as soon as the hub answers.
    healthcheck:
      start_period: 30s
      start_interval: 1s
    environment:
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set ACCESS_TEAM_DOMAIN in .env}
      ACCESS_AUD: ${ACCESS_AUD:?set ACCESS_AUD in .env}
      HUB_PUBLIC_URL: https://${MEETVINCI_PUBLIC_HOST}
      HUB_WEB_URL: http://web:47190
      HUB_ADMIN_EMAILS: ${HUB_ADMIN_EMAILS:?set HUB_ADMIN_EMAILS in .env}
      # The global sync at start runs once per version, not at every restart.
      HUB_VERSION: ${MEETVINCI_TAG}
      PROVISIONER_URL: http://provisioner:47193
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?set PROVISIONER_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./hub:/data
      - ipc:/ipc
    networks:
      tunnel: {}
      web: {}
      provisioner: {}

  # Adds, disables and removes people for the hub's admin panel by running `bun deploy.ts apply` in /opt/meetvinci, and
  # updates the Access allow policy when CLOUDFLARE_API_TOKEN is set. It holds the Docker socket, which is root on the
  # host: it answers only the hub's token on the provisioner network, a fixed set of requests, one change at a time.
  # Root without capabilities: it reads and writes root's files in /opt/meetvinci and the socket as their owner.
  # /opt/meetvinci is mounted at the same path, so Compose resolves ./hub and the other relative paths as on the host.
  provisioner:
    image: meetvinci-provisioner:${MEETVINCI_TAG}
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    environment:
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?set PROVISIONER_TOKEN in .env}
      # Optional: with a token, the provisioner keeps the Access allow policy in line with users.yaml.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE: ${CLOUDFLARE_ZONE:-}
      CLOUDFLARE_NAME: ${CLOUDFLARE_NAME:-}
      # The domain rule of the allow policy, if any: people at these domains need no change in Cloudflare.
      CLOUDFLARE_ACCESS_DOMAINS: ${CLOUDFLARE_ACCESS_DOMAINS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/meetvinci
    networks:
      provisioner: {}
      egress: {}

  # Keeps bots off the server's internal addresses: every daemon reaches the internet and DNS, the hub reaches each
  # daemon's port, and nothing else (the hub, web, provisioner, other daemons, cloudflared, the host and its sshd,
  # cloud metadata, private ranges). Named iptables chains for the daemon bridges (mv-d*), in DOCKER-USER and INPUT;
  # no policy and no other rule changes. The rules outlive this container; until it first writes them (at boot, about
  # 0.2 s), daemons are unfiltered, and the hub cannot reach them because their networks drop traffic between
  # containers. `bun deploy.ts firewall remove` deletes the rules.
  firewall:
    image: meetvinci-firewall:${MEETVINCI_TAG}
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    restart: unless-stopped
    environment:
      # Off by default: comma-separated <IPv4>:<port> (TCP) that every daemon may still reach.
      MEETVINCI_INTERNAL_ALLOW: ${MEETVINCI_INTERNAL_ALLOW:-}

  # One shared web app in hub mode: its server calls only the hub, never a daemon.
  web:
    image: meetvinci-web:${MEETVINCI_TAG}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    environment:
      WEB_HUB_URL: http://hub:47192
      WEB_PUBLIC_URL: https://${MEETVINCI_PUBLIC_HOST}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      web: {}

networks:
  # cloudflared (deploy/cloudflare/cloudflared.compose.yaml) and the hub. Outbound internet: the tunnel and the hub's
  # Access key fetch.
  tunnel: {}
  # The hub and the web app only. No internet.
  web:
    internal: true
  # The hub and the provisioner only. No internet.
  provisioner:
    internal: true
  # The provisioner's way out, to the Cloudflare API only when a token is set. Nothing else joins it.
  egress: {}

volumes:
  # Each person's data/ipc folder, as ipc/<id>. Daemons mount only their own subfolder.
  ipc: {}
