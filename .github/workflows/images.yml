name: Images

# Builds every Vinci image (docker-bake.hcl) for linux/amd64 and linux/arm64. A release tag (scripts/release.ts pushes
# vX.Y.Z) tags them vX.Y.Z, vX.Y and the short commit; a manual run builds the chosen ref and tags it with the short
# commit only.
#
# Images go to GitHub's container registry as ghcr.io/meetvinci/vinci-<target>, private, pushed with the workflow's own
# GITHUB_TOKEN. Each architecture pushes by digest; `merge` joins them under the tags; `cleanup` deletes old manual
# builds. Servers pull with a read-only token of the registry's machine account (docs/team-workspace/admin.md).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io/meetvinci

jobs:
  tags:
    name: Tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.json }}
    steps:
      # No images: plain tags, which the merge job puts on each vinci-<target>. No `latest`: VINCI_TAG names a version.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=sha,prefix=,format=short

  build:
    name: Build ${{ matrix.arch }}
    # Native runners, not QEMU: the build runs bun install and bundles the apps, far too slow emulated. Arm64 standard
    # runners work in private repositories since 2026-01-29 (2 vCPU there, billed from the plan's minutes).
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The checkout as the context (source: .), so .dockerignore applies.
      - name: Build
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: '*.platform=linux/${{ matrix.arch }}'
          vars: |
            CACHE_SCOPE=images-${{ matrix.arch }}
            REGISTRY=${{ env.REGISTRY }}
            PUSH_BY_DIGEST=true

      - name: Save digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: echo "$METADATA" > "$RUNNER_TEMP/digests-${{ matrix.arch }}.json"

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error

  # Joins each image's two architectures into one multi-arch tag per tag from the `tags` job.
  merge:
    name: Publish
    needs: [tags, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for target in $(jq -r 'to_entries[] | select(.value | type == "object" and has("containerimage.digest")) | .key' "$DIGESTS/digests-amd64.json"); do
            image="$REGISTRY/vinci-$target"
            mapfile -t tags < <(jq -r --arg image "$image" '.tags[] | "--tag=\($image):\(.)"' <<<"$TAGS")
            mapfile -t sources < <(jq -r --arg target "$target" --arg image "$image" '.[$target]["containerimage.digest"] | "\($image)@\(.)"' "$DIGESTS"/digests-*.json)
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$(jq -r '.tags[0]' <<<"$TAGS")"
          done

  # Keeps every release (v* tags) and the 5 newest builds of manual runs, and deletes older manual builds with the
  # per-architecture images they leave behind. It understands multi-arch images, unlike deleting untagged versions by
  # hand, which breaks them.
  cleanup:
    name: Clean up old images
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    timeout-minutes: 10
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: vinci-daemon,vinci-sandbox,vinci-web,vinci-hub,vinci-provisioner,vinci-firewall
          exclude-tags: v*
          keep-n-tagged: 5
          delete-untagged: true
          delete-partial-images: true
