name: Images

# Builds every Vinci image (docker-bake.hcl) for linux/amd64 and linux/arm64. A release tag (scripts/release.ts pushes
# vX.Y.Z) tags them X.Y.Z, X.Y and the short commit; a manual run builds the chosen ref and tags it with the short
# commit only.
#
# There is no registry yet, so nothing logs in or pushes: each architecture builds into the cache and stops. To publish,
# uncomment every line marked `# push:` below (the REGISTRY env, the two logins, PUSH_BY_DIGEST, the digest upload and
# the whole `merge` job) and add the REGISTRY_USERNAME and REGISTRY_PASSWORD secrets.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# push: env:
# push:   REGISTRY: registry.example.com/vinci

jobs:
  tags:
    name: Tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.json }}
    steps:
      # No images: plain tags, which the merge job puts on each vinci-<target>. No `latest`: VINCI_TAG names a version.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=sha,prefix=,format=short

  build:
    name: Build ${{ matrix.arch }}
    # Native runners, not QEMU: the build runs bun install and bundles the apps, far too slow emulated. Arm64 standard
    # runners work in private repositories since 2026-01-29 (2 vCPU there, billed from the plan's minutes).
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # push: - name: Log in to the registry
      # push:   uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      # push:   with:
      # push:     registry: ${{ env.REGISTRY }}
      # push:     username: ${{ secrets.REGISTRY_USERNAME }}
      # push:     password: ${{ secrets.REGISTRY_PASSWORD }}

      # The checkout as the context (source: .), so .dockerignore applies.
      - name: Build
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: '*.platform=linux/${{ matrix.arch }}'
          vars: |
            CACHE_SCOPE=images-${{ matrix.arch }}
          # push:   REGISTRY=${{ env.REGISTRY }}
          # push:   PUSH_BY_DIGEST=true

      # push: - name: Save digests
      # push:   env:
      # push:     METADATA: ${{ steps.bake.outputs.metadata }}
      # push:   run: echo "$METADATA" > "$RUNNER_TEMP/digests-${{ matrix.arch }}.json"
      # push:
      # push: - name: Upload digests
      # push:   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      # push:   with:
      # push:     name: digests-${{ matrix.arch }}
      # push:     path: ${{ runner.temp }}/digests-${{ matrix.arch }}.json
      # push:     retention-days: 1
      # push:     if-no-files-found: error

  # Joins each image's two architectures into one multi-arch tag per tag from the `tags` job.
