name: Images

# Builds every Vinci image, including the API, from docker-bake.hcl for linux/amd64 and linux/arm64.
# A release tag produces a vX.Y.Z image tag, a push to main the tags `main` and the full commit, and a manual run on
# any branch the full commit.
#
# Images go to GitHub Container Registry as ghcr.io/meetvinci/vinci-<target>, pushed with the workflow's GITHUB_TOKEN.
# The packages are public, so servers pull them without logging in (docs/install/admin.md). Each architecture
# pushes by digest; `merge` joins them under the tags.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# A newer push to main replaces an older main build still running; release tags and manual runs always finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

permissions: {}

env:
  REGISTRY: ghcr.io/meetvinci
  SOURCE: https://github.com/${{ github.repository }}

jobs:
  tags:
    name: Tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.json }}
    steps:
      # No images: plain tags, which the merge job puts on each vinci-<target>. No `latest`: VINCI_TAG names a version,
      # `main` follows the main branch.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

  build:
    name: Build ${{ matrix.arch }}
    # Native runners, not QEMU: the build runs bun install and bundles the apps, far too slow emulated.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the admin panel shows (VINCI_VERSION in the hub image): the release for its tag, else the release and the
      # short commit. The same rule as `bun run build:images` (scripts/deploy.ts).
      - name: Version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then version="$version (${GITHUB_SHA::7})"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The checkout as the context (source: .), so .dockerignore applies.
      # No provenance in the metadata output: on a push it carries the whole event payload, too large for the env of
      # the next step ("Argument list too long"). The images keep their provenance attestations.
      - name: Build
        id: bake
        env:
          BUILDX_METADATA_PROVENANCE: disabled
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.labels.org.opencontainers.image.source=${{ env.SOURCE }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
          vars: |
            CACHE_SCOPE=images-${{ matrix.arch }}
            REGISTRY=${{ env.REGISTRY }}
            PUSH_BY_DIGEST=true
            VERSION=${{ steps.version.outputs.version }}

      - name: Save digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: echo "$METADATA" > "$RUNNER_TEMP/digests-${{ matrix.arch }}.json"

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error

  # Joins each image's two architectures into one multi-arch tag per tag from the `tags` job. The index carries the
  # source annotation too, which is what links a multi-arch package to the repository on GitHub.
  merge:
    name: Publish
    needs: [tags, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for target in $(jq -r 'to_entries[] | select(.value | type == "object" and has("containerimage.digest")) | .key' "$DIGESTS/digests-amd64.json"); do
            image="$REGISTRY/vinci-$target"
            mapfile -t tags < <(jq -r --arg image "$image" '.tags[] | "--tag=\($image):\(.)"' <<<"$TAGS")
            mapfile -t sources < <(jq -r --arg target "$target" --arg image "$image" '.[$target]["containerimage.digest"] | "\($image)@\(.)"' "$DIGESTS"/digests-*.json)
            docker buildx imagetools create --annotation "index:org.opencontainers.image.source=$SOURCE" "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$(jq -r '.tags[0]' <<<"$TAGS")"
          done
